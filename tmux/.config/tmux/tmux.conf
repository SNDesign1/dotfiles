# tmux config for the nvim + coding-agent layout (see agent-dev and nvim/lua/agent.lua)

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# nvim reloads files the agent changed when it regains focus (FocusGained needs this)
set -g focus-events on

# move between the editor and agent panes without the prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# new panes and windows open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# show the agent's bell as a status-line marker on its window
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# quiet dark green-grey look: dark status line, session name left, clock right
set -g status-position bottom
set -g status-style "bg=#0b110d,fg=#3f8f55"
set -g status-left-length 40
set -g status-left "#[fg=#00ff66,bold] #S #[default]"
set -g status-right "#[fg=#3f8f55]%H:%M "
set -g window-status-format ""
set -g window-status-current-format ""
set -g pane-border-lines single
set -g pane-border-style "fg=#1f3a27"
set -g pane-active-border-style "fg=#2fa860"
set -g message-style "bg=#17241b,fg=#00ff66"
