# kitty config for the agent-dev window (dark green-grey theme, no blues) (nvim + agent in tmux). Used only via `kitty --config`, so your normal kitty is untouched.

font_family      MesloLGM Nerd Font Mono
font_size        11.5

# no menu bar or toolbar, just the terminal
tab_bar_min_tabs 2
hide_window_decorations no
window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no
remember_window_size no
initial_window_width 200c
initial_window_height 52c
cursor_blink_interval 0
mouse_hide_wait -1

# dark green-grey with phosphor-green accents, no blues
foreground            #b7ffc4
background            #0e1511
selection_foreground  #0e1511
selection_background  #00ff66
cursor                #00ff66
cursor_text_color     #0e1511
url_color             #7ef0a8
color0  #0b110d
color1  #ff5f7a
color2  #00ff66
color3  #e6e86a
color4  #3fcf8e
color5  #c792ea
color6  #2fe0a0
color7  #b7ffc4
color8  #2a4a33
color9  #ff8fa3
color10 #5dff94
color11 #f0f28f
color12 #7ef0a8
color13 #e0b8ff
color14 #6ff5c4
color15 #e8fff0
